[LOGS]
log_dir = ./logs/
file_mask = access.log*

[DATABASE]
# Используем SQLite для мгновенного запуска в онлайн-среде
db_type = sqlite
# Путь к файлу базы данных
name = ./app.db
host = localhost
port = 5432
user = user
password = password

[PARSER]
batch_size = 1000

[API]
host = 0.0.0.0
port = 5000
secret_key = super-secret-online-key
